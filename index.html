<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razib Marketing | SEO Visibility Report Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#a3d11b', dark: '#8dba16', light: '#bcf21d', 50: '#f6fbe8', 100: '#eaf6c8' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 40px -10px rgba(163, 209, 27, 0.45)',
                        'card': '0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.03)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.025em; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-brand selection:text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const API_ENDPOINT = "/generate"; 

        const { useState, useRef, useEffect } = React;

        const formatFileSize = (bytes) => {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            const kb = bytes / 1024;
            if (kb < 1024) return kb.toFixed(1) + ' KB';
            return (kb / 1024).toFixed(2) + ' MB';
        };

        const FileUploadZone = ({ id, step, label, subtitle, accept, badgeColor, icon, required, file, setFile }) => {
            const inputRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            useEffect(() => { lucide.createIcons(); });

            const handleFileChange = (e) => { if (e.target.files && e.target.files.length > 0) setFile(e.target.files[0]); };
            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
            const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) setFile(e.dataTransfer.files[0]); };
            const clearFile = (e) => { e.stopPropagation(); setFile(null); if (inputRef.current) inputRef.current.value = ""; };

            return (
                <div onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} onClick={() => inputRef.current.click()}
                    className={`group relative p-6 rounded-2xl border-2 transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[230px] ${file ? 'border-brand bg-brand-50 shadow-md' : isDragging ? 'border-brand bg-brand-50/60 scale-[1.02] shadow-lg' : 'border-dashed border-slate-200 bg-white hover:border-brand hover:shadow-card hover:-translate-y-1'}`} >
                    <div className="flex items-center justify-between w-full mb-3">
                        <span className="text-xs font-display font-bold uppercase tracking-wider text-slate-400">Step 0{step}</span>
                        {required ? (<span className="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-slate-900 text-white border border-slate-800">Required</span>) : (<span className="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-slate-100 text-slate-500">Optional</span>)}
                    </div>
                    <div className="flex flex-col items-center text-center my-auto py-2">
                        {file ? (<div className="w-14 h-14 rounded-2xl bg-brand text-white flex items-center justify-center mb-3 shadow-inner"><i data-lucide="check-circle-2" className="w-7 h-7"></i></div>) : (<div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-3 transition-transform duration-300 group-hover:scale-110 ${badgeColor}`}><i data-lucide={icon} className="w-7 h-7"></i></div>)}
                        <h3 className="font-display font-bold text-base text-slate-900 mb-1">{label}</h3>
                        {!file ? (<p className="text-xs text-slate-500 leading-relaxed max-w-[200px]">{subtitle}</p>) : (<div className="mt-1 px-3 py-1.5 bg-white rounded-lg border border-brand/30 shadow-sm max-w-full"><p className="text-xs font-semibold text-slate-800 truncate max-w-[180px]" title={file.name}>{file.name}</p><p className="text-[11px] text-brand-dark font-medium mt-0.5">{formatFileSize(file.size)} • Ready</p></div>)}
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                        <span className="font-mono text-[11px] font-medium text-slate-400 bg-slate-50 px-2 py-0.5 rounded border border-slate-200/60">{accept}</span>
                        {file ? (<button type="button" onClick={clearFile} className="text-xs font-semibold text-rose-500 hover:text-rose-700 flex items-center gap-1 transition-colors"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i>Remove</button>) : (<span className="text-slate-800 font-semibold group-hover:text-brand-dark group-hover:translate-x-0.5 transition-all flex items-center gap-1">Browse <i data-lucide="arrow-up-right" className="w-3.5 h-3.5"></i></span>)}
                    </div>
                    <input type="file" id={id} accept={accept} className="hidden" ref={inputRef} onChange={handleFileChange} />
                </div>
            );
        };

        const App = () => {
            const [template, setTemplate] = useState(null);
            const [xlsx, setXlsx] = useState(null);
            const [pdf, setPdf] = useState(null);
            const [targetUrl, setTargetUrl] = useState("");
            const [crawlLoading, setCrawlLoading] = useState(false);
            const [crawlResult, setCrawlResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [successMsg, setSuccessMsg] = useState("");
            useEffect(() => { lucide.createIcons(); });
            const readyCount = (template ? 1 : 0) + (xlsx ? 1 : 0);

            const slimWorkbookIfNeeded = async (file) => {
                if (!file || typeof XLSX === "undefined") return { slimFile: file, keywords: [], urls: [] };
                try {
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: "array" });
                    const sheetName = wb.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
                    if (!rows || rows.length === 0) return { slimFile: file, keywords: [], urls: [] };

                    const cols = Object.keys(rows[0]);
                    const kwCol = cols.find(c => /keyword|query|search term/i.test(c)) || cols[0];
                    const posCol = cols.find(c => /position|rank/i.test(c)) || cols[1];
                    const volCol = cols.find(c => /volume|searches/i.test(c)) || cols[2];
                    const urlCol = cols.find(c => /^(url|landing page|page url)$/i.test(c.trim()));

                    const keywords = [];
                    const urls = [];
                    const slimRows = [];
                    for (const r of rows) {
                        const kw = String(r[kwCol] || "").trim();
                        if (!kw) continue;
                        keywords.push(kw);
                        const u = urlCol ? String(r[urlCol] || "").trim() : "";
                        if (u && urls.length < 250) urls.push(u);
                        const rowObj = { Keyword: kw, Position: r[posCol], "Search Volume": volCol ? r[volCol] : 0 };
                        if (urlCol) rowObj.URL = u;
                        slimRows.push(rowObj);
                    }

                    // If file is over 1.8 MB, build a compact .xlsx with only the required columns so serverless payload stays small
                    if (file.size > 1800000) {
                        const newWb = XLSX.utils.book_new();
                        const newWs = XLSX.utils.json_to_sheet(slimRows);
                        XLSX.utils.book_append_sheet(newWb, newWs, "Keywords");
                        const outArray = XLSX.write(newWb, { bookType: "xlsx", type: "array", compression: true });
                        const slimBlob = new Blob([outArray], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                        const slimFile = new File([slimBlob], file.name, { type: slimBlob.type });
                        return { slimFile, keywords, urls };
                    }
                    return { slimFile: file, keywords, urls };
                } catch (e) {
                    console.warn("Workbook client parse fallback:", e);
                    return { slimFile: file, keywords: [], urls: [] };
                }
            };

            const fetchWithTimeoutRetry = async (url, options, { timeoutMs = 55000, retries = 1 } = {}) => {
                let lastErr;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const response = await fetch(url, { ...options, signal: controller.signal });
                        clearTimeout(timer);
                        if ((response.status === 502 || response.status === 503) && attempt < retries) {
                            await new Promise((r) => setTimeout(r, 1200 * (attempt + 1)));
                            continue;
                        }
                        return response;
                    } catch (err) {
                        clearTimeout(timer);
                        lastErr = err.name === "AbortError"
                            ? new Error("The request timed out. Please try again.")
                            : err;
                        if (attempt < retries) {
                            await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
                            continue;
                        }
                    }
                }
                throw lastErr;
            };

            const validateUploadFile = (file, expectedExt, label) => {
                if (!file) return;
                if (!file.name.toLowerCase().endsWith(expectedExt)) {
                    throw new Error(`${label} must be a ${expectedExt} file.`);
                }
                if (file.size > 5 * 1024 * 1024 && expectedExt !== ".xlsx") {
                    throw new Error(`${label} exceeds the 5 MB upload limit.`);
                }
            };

            const parseJsonResponse = async (response, fallbackMsg) => {
                const rawText = await response.text();
                let data = null;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    if (/Request Entity Too Large/i.test(rawText) || response.status === 413) {
                        throw new Error("The uploaded files exceeded the server request size limit. Please try again.");
                    }
                    throw new Error(rawText.slice(0, 180) || fallbackMsg);
                }
                if (!response.ok) throw new Error(data.error || fallbackMsg);
                return data;
            };

            const handleCrawl = async () => {
                if (!targetUrl.trim() && !xlsx) {
                    setError("Please enter a Target Website URL or upload the Keywords Workbook (.xlsx) first.");
                    return;
                }
                setError(""); setCrawlLoading(true);
                try {
                    validateUploadFile(xlsx, ".xlsx", "Keywords Workbook");
                    const { keywords, urls } = xlsx ? await slimWorkbookIfNeeded(xlsx) : { keywords: [], urls: [] };
                    const response = await fetchWithTimeoutRetry("/crawl", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            target_url: targetUrl.trim(),
                            workbook_keywords: keywords,
                            workbook_urls: urls,
                            property_title: xlsx ? xlsx.name.replace(/\.xlsx$/i, "") : "",
                        }),
                    });
                    const data = await parseJsonResponse(response, "Failed to crawl target website.");
                    setCrawlResult(data);
                    if (!targetUrl.trim() && data.target_url) setTargetUrl(data.target_url);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setCrawlLoading(false);
                }
            };

            const handleGenerate = async () => {
                if (!template || !xlsx) {
                    setError("Please upload both the PowerPoint Template (.pptx) and the Keywords Sheet (.xlsx) to continue.");
                    setSuccessMsg(""); return;
                }
                setError(""); setSuccessMsg(""); setLoading(true);
                try {
                    validateUploadFile(template, ".pptx", "PowerPoint Template");
                    validateUploadFile(xlsx, ".xlsx", "Keywords Workbook");
                    validateUploadFile(pdf, ".pdf", "Semrush Audit PDF");
                    const { slimFile } = await slimWorkbookIfNeeded(xlsx);
                    const formData = new FormData();
                    formData.append("template", template);
                    formData.append("xlsx", slimFile);
                    if (pdf) formData.append("pdf", pdf);
                    if (targetUrl.trim()) formData.append("target_url", targetUrl.trim());

                    const response = await fetchWithTimeoutRetry(API_ENDPOINT, { method: "POST", body: formData });
                    
                    if (!response.ok) {
                        await parseJsonResponse(response, "Failed to generate presentation.");
                    }

                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let fileName = "seo_visibility_report.pptx";
                    if (contentDisposition && contentDisposition.includes('filename=')) {
                        fileName = contentDisposition.split('filename=')[1].replace(/["';]/g, '');
                    }
                    
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                    setSuccessMsg(`Successfully built "${fileName}"! Check your downloads.`);
                } catch (err) {
                    console.error(err); 
                    if (err.message.includes("Failed to fetch")) {
                        setError(`Failed to fetch: Make sure you are running 'python3 app.py' and viewing this page at http://127.0.0.1:8080.`);
                    } else {
                        setError(err.message);
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="glass-nav sticky top-0 z-30 border-b border-slate-200/80">
                        <div className="max-w-5xl mx-auto px-6 h-[72px] flex items-center justify-between">
                            <a href="https://razibmarketing.com/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 group">
                                <div className="w-[42px] h-[42px] bg-brand flex items-center justify-center text-white font-display font-black text-[22px] shadow-sm group-hover:scale-105 transition-transform" style={{ letterSpacing: '-1.5px' }}><span style={{ display: 'inline-block', transform: 'scaleX(-1)', marginRight: '-1px' }}>R</span>M</div>
                                <div className="flex flex-col justify-center"><span className="font-display font-black text-slate-900 text-[20px] tracking-tight block leading-none uppercase mt-0.5" style={{ letterSpacing: '0.02em' }}>RAZIB</span><span className="font-display font-light text-slate-800 text-[12px] block leading-none mt-1.5 uppercase" style={{ letterSpacing: '0.24em' }}>MARKETING</span></div>
                            </a>
                        </div>
                    </header>
                    <main className="flex-grow max-w-5xl w-full mx-auto px-6 py-10">
                        <div className="bg-white rounded-3xl shadow-card border border-slate-200/80 p-6 md:p-10">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 mb-8 border-b border-slate-100">
                                <div><h2 className="font-display text-2xl font-bold text-slate-900">Upload Source Files</h2></div>
                            </div>
                            {error && (<div className="flex items-start gap-3 bg-rose-50 border border-rose-200 p-4 mb-6 text-rose-800 rounded-2xl"><i data-lucide="alert-circle" className="w-5 h-5 text-rose-600 shrink-0 mt-0.5"></i><div className="text-sm font-medium">{error}</div></div>)}
                            {successMsg && (<div className="flex items-start gap-3 bg-brand-50 border border-brand/30 p-4 mb-6 text-slate-800 rounded-2xl"><i data-lucide="check-circle" className="w-5 h-5 text-brand-dark shrink-0 mt-0.5"></i><div className="text-sm font-semibold">{successMsg}</div></div>)}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                                <FileUploadZone id="template" step={1} label="PowerPoint Template" subtitle="Master slide deck" accept=".pptx" badgeColor="bg-orange-50 text-orange-600 border border-orange-100" icon="presentation" required={true} file={template} setFile={setTemplate} />
                                <FileUploadZone id="xlsx" step={2} label="Keywords Workbook" subtitle="Excel export" accept=".xlsx" badgeColor="bg-emerald-50 text-emerald-600 border border-emerald-100" icon="file-spreadsheet" required={true} file={xlsx} setFile={setXlsx} />
                                <FileUploadZone id="pdf" step={3} label="Semrush Audit PDF" subtitle="Optional PDF report" accept=".pdf" badgeColor="bg-blue-50 text-blue-600 border border-blue-100" icon="file-text" required={false} file={pdf} setFile={setPdf} />
                            </div>

                            <div className="mb-8 p-6 rounded-2xl border-2 border-slate-200/80 bg-slate-50/70 transition-all">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                    <div className="flex items-center gap-2.5">
                                        <span className="text-xs font-display font-bold uppercase tracking-wider text-slate-400">Step 04</span>
                                        <h3 className="font-display font-bold text-base text-slate-900">Target Website Crawl & Service Match</h3>
                                    </div>
                                    <span className="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-purple-50 text-purple-700 border border-purple-200 w-fit">Service Verification</span>
                                </div>
                                <p className="text-xs text-slate-500 mb-4">
                                    Enter the target property website URL to crawl its offerings and match services against your Keywords Workbook. Unmatched services are automatically excluded from the Ancillary Keyword Position Summary.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <div className="relative flex-grow">
                                        <input
                                            type="url"
                                            value={targetUrl}
                                            onChange={(e) => setTargetUrl(e.target.value)}
                                            placeholder="https://www.marriott.com/en-us/hotels/... or https://www.propertywebsite.com"
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                                        />
                                    </div>
                                    <button
                                        type="button"
                                        onClick={handleCrawl}
                                        disabled={crawlLoading}
                                        className={`px-5 py-3 rounded-xl font-display font-bold text-xs whitespace-nowrap transition-all flex items-center justify-center gap-2 border ${crawlLoading ? 'bg-slate-200 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-800 border-slate-300 hover:border-brand hover:bg-brand-50'}`}
                                    >
                                        <i data-lucide="globe" className="w-4 h-4"></i>
                                        {crawlLoading ? "Crawling Website..." : "Crawl & Match Workbook"}
                                    </button>
                                </div>

                                {crawlResult && (
                                    <div className="mt-4 p-4 rounded-xl bg-white border border-slate-200/90 text-xs space-y-2.5">
                                        <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-100">
                                            <span className="font-semibold text-slate-800 truncate max-w-xl" title={crawlResult.page_title}>
                                                Target: {crawlResult.page_title}
                                            </span>
                                            <span className="text-[11px] font-medium text-slate-500">
                                                {crawlResult.crawled_pages > 0
                                                    ? `${crawlResult.crawled_pages} page(s) crawled${crawlResult.sitemap_urls ? ` • ${crawlResult.sitemap_urls} sitemap URLs scanned` : ''}`
                                                    : 'URL & Workbook profile analyzed'}
                                            </span>
                                        </div>
                                        <div>
                                            <span className="font-semibold text-emerald-700 block mb-1">Matched Services (Included in Ancillary Keyword Position Summary):</span>
                                            <div className="flex flex-wrap gap-1.5">
                                                {(crawlResult.matched_services && crawlResult.matched_services.length > 0) ? crawlResult.matched_services.map((s, idx) => (
                                                    <span key={idx} className="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium text-[11px]">{s}</span>
                                                )) : <span className="text-slate-400">No hospitality-specific services detected on this website</span>}
                                            </div>
                                        </div>
                                        {crawlResult.page_topics && crawlResult.page_topics.length > 0 && (
                                            <div>
                                                <span className="font-semibold text-slate-700 block mb-1">Detected Website Topics & Headings:</span>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {crawlResult.page_topics.map((t, idx) => (
                                                        <span key={idx} className="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200 font-medium text-[11px]">{t}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {crawlResult.unmatched_services && crawlResult.unmatched_services.length > 0 && (
                                            <div>
                                                <span className="font-semibold text-rose-600 block mb-1">Excluded Unmatched Services (Removed from Ancillary Keyword Position Summary):</span>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {crawlResult.unmatched_services.map((s, idx) => (
                                                        <span key={idx} className="px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200 font-medium text-[11px]">{s}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                            <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-lg">
                                <button onClick={handleGenerate} disabled={loading} className={`w-full sm:w-auto flex items-center justify-center gap-2.5 px-8 py-4 rounded-xl font-display font-bold text-sm transition-all duration-300 ${loading ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-brand text-slate-900 hover:bg-brand-light shadow-glow hover:-translate-y-1 active:translate-y-0'}`}>
                                    {loading ? (<><i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>Building Presentation...</>) : (<><i data-lucide="wand-2" className="w-5 h-5"></i>Generate & Download Deck</>)}
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
